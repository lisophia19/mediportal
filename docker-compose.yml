version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediportal}
      POSTGRES_USER: ${POSTGRES_USER:-mediportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediportal}
    # Not published to the host -- only the backend container talks to this,
    # over the internal docker network. Local dev connects via `docker
    # compose exec postgres psql` rather than a host port.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediportal} -d ${POSTGRES_DB:-mediportal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mediportal}:${POSTGRES_PASSWORD:-mediportal}@postgres:5432/${POSTGRES_DB:-mediportal}
      SECRET_KEY: ${SECRET_KEY}
      AGENT_KEY: ${AGENT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      SCHEDULING_PROVIDER: ${SCHEDULING_PROVIDER:-postgres}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      # VITE_API_BASE_URL must be a build arg, not a runtime environment
      # var -- Vite bakes it into the static bundle at `npm run build` time.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    restart: unless-stopped
    ports:
      # Loopback-only -- reached exclusively through Caddy (TLS termination
      # + hostname), which reverse-proxies here the same way it proxies
      # /api/* to the backend. Not meant to be reachable directly.
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
